services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: table21
      MYSQL_USER: table21
      MYSQL_PASSWORD: table21_dev
      MYSQL_ROOT_PASSWORD: table21_root_dev
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
